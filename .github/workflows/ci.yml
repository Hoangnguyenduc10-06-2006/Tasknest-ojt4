name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm test && npm run build
        working-directory: frontend
  backend-and-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prepare disposable Compose environment
        id: env_prepare
        run: python3 scripts/setup-local.py
      - run: ./mvnw -B verify
      - name: AI foundation on isolated MySQL and Identity stub
        run: python3 scripts/test-ai-foundation.py
      - name: Scan packaged Java dependencies against OSV
        run: python3 scripts/check-java-dependencies.py
      - name: Fixed-window regression helper checks
        run: python3 -m unittest discover -s scripts -p 'test_rate_limit_checks.py'
      - name: Deployment failure and backup guards
        run: python3 -m unittest discover -s scripts -p 'test_deploy_release.py'
      - name: Auth, mail and member security regressions on disposable services
        run: python3 scripts/test-project-members.py
      - name: Workspace and notification regressions on isolated databases
        run: python3 scripts/test-workspace-data.py
      - name: Community profiles, team reviews and marketplace regressions
        run: python3 scripts/test-community.py
      - name: Validate domain schema on isolated MySQL
        run: python3 scripts/test-schema.py --service-startup
      - run: scripts/compose.sh config --quiet
      - name: Validate production Compose and deployment scripts
        env:
          IMAGE_PREFIX: ghcr.io/tasknest/ci-validation
          RELEASE_SHA: ${{ github.sha }}
        run: |
          bash -n scripts/ci-deploy.sh scripts/deploy-release.sh
          docker compose --env-file .env -f infra/compose/compose.yml -f infra/compose/compose.production.yml config --quiet
      - run: scripts/compose.sh up -d --build --wait --wait-timeout 300
      - run: python3 scripts/smoke-test.py
      - run: python3 scripts/check-infrastructure.py
      - name: Container health summary
        if: ${{ always() && steps.env_prepare.outcome == 'success' }}
        run: scripts/compose.sh ps
      - name: Clean disposable CI environment
        if: ${{ always() && steps.env_prepare.outcome == 'success' }}
        run: scripts/compose.sh down --volumes --remove-orphans

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [frontend, backend-and-compose]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package tested revision
        run: ./mvnw -B package -DskipTests
      - name: Publish immutable release images to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          for service in config-server discovery-server identity-service work-service notification-service ai-service api-gateway frontend; do
            case "$service" in
              config-server|discovery-server|api-gateway) dockerfile="platform/$service/Dockerfile" ;;
              frontend) dockerfile="frontend/Dockerfile" ;;
              *) dockerfile="services/$service/Dockerfile" ;;
            esac
            image="$prefix/$service:$GITHUB_SHA"
            docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -f "$dockerfile" -t "$image" .
            docker push "$image"
          done
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    concurrency:
      group: tasknest-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Deploy tested release over SSH
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_PATH || '/var/www/tasknest' }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-deploy.sh
