<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <title>TaskNest</title>
    <link rel="icon" type="image/png" href="/brand/mark.png" />
    <link rel="apple-touch-icon" href="/brand/mark.png" />
    <script>
      try {
        const theme = localStorage.getItem('tasknest-theme');
        document.documentElement.classList.toggle('dark', theme === 'dark' || ((!theme || theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches));
      } catch { document.documentElement.classList.toggle('dark', matchMedia('(prefers-color-scheme: dark)').matches); }
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
