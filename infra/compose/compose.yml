name: ${COMPOSE_PROJECT_NAME:-tasknest}
x-java: &java
  restart: unless-stopped
  networks: [backend]
  mem_limit: 512m
x-client-env: &client-env
  CONFIG_SERVER_URL: http://config-server:8888
  CONFIG_USERNAME: ${CONFIG_USERNAME:?Run setup-local.py}
  CONFIG_PASSWORD: ${CONFIG_PASSWORD:?Run setup-local.py}
  EUREKA_URL: http://${DISCOVERY_USERNAME:?Run setup-local.py}:${DISCOVERY_PASSWORD:?Run setup-local.py}@discovery-server:8761/eureka/
  SCAFFOLD_SECURITY_PASSWORD: ${SCAFFOLD_SECURITY_PASSWORD:?Run setup-local.py}
  JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
x-business-env: &business-env
  <<: *client-env
  DB_HOST: mysql
  DB_PORT: 3306
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Run setup-local.py}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Run setup-local.py}
x-business-deps: &business-deps
  config-server: {condition: service_healthy}
  discovery-server: {condition: service_healthy}
  mysql: {condition: service_healthy}
  rabbitmq: {condition: service_healthy}
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    networks: [backend]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run setup-local.py}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Run setup-local.py}
      WORK_DB_PASSWORD: ${WORK_DB_PASSWORD:?Run setup-local.py}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Run setup-local.py}
    volumes:
      - mysql-data:/var/lib/mysql
      - ../mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP -h127.0.0.1 -uroot --silent --execute="SELECT 1" > /dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    restart: unless-stopped
    networks: [backend]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Run setup-local.py}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run setup-local.py}
      RABBITMQ_DEFAULT_VHOST: /tasknest
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
  config-server:
    <<: *java
    build: {context: ../.., dockerfile: platform/config-server/Dockerfile}
    environment:
      CONFIG_USERNAME: ${CONFIG_USERNAME:?Run setup-local.py}
      CONFIG_PASSWORD: ${CONFIG_PASSWORD:?Run setup-local.py}
      CONFIG_SEARCH_LOCATIONS: file:/config-repo
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
    volumes: [../config-repo:/config-repo:ro]
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9888/actuator/health/readiness]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
  discovery-server:
    <<: *java
    build: {context: ../.., dockerfile: platform/discovery-server/Dockerfile}
    environment:
      <<: *client-env
      DISCOVERY_USERNAME: ${DISCOVERY_USERNAME:?Run setup-local.py}
      DISCOVERY_PASSWORD: ${DISCOVERY_PASSWORD:?Run setup-local.py}
      MANAGEMENT_PORT: 9761
    depends_on: {config-server: {condition: service_healthy}}
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9761/actuator/health/readiness]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
  identity-service:
    <<: *java
    build: {context: ../.., dockerfile: services/identity-service/Dockerfile}
    environment:
      <<: *business-env
      MANAGEMENT_PORT: 9081
      DB_NAME: tasknest_identity
      DB_USERNAME: tasknest_identity
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Run setup-local.py}
      TASKNEST_PROXY_KEY: ${TASKNEST_PROXY_KEY:?Run setup-auth-secrets.py}
      IDENTITY_JWT_PRIVATE_KEY_BASE64: ${IDENTITY_JWT_PRIVATE_KEY_BASE64:?Run setup-auth-secrets.py}
      IDENTITY_OUTBOX_KEY_BASE64: ${IDENTITY_OUTBOX_KEY_BASE64:?Run setup-auth-secrets.py}
      IDENTITY_OUTBOX_KEY_ID: ${IDENTITY_OUTBOX_KEY_ID:?Run setup-auth-secrets.py}
      IDENTITY_ALLOWED_ORIGINS: ${IDENTITY_ALLOWED_ORIGINS:-http://localhost:3000}
      IDENTITY_COOKIE_SECURE: ${IDENTITY_COOKIE_SECURE:-true}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      AUTH_MAIL_ADDRESS_ATTEMPTS: ${AUTH_MAIL_ADDRESS_ATTEMPTS:-10}
      AUTH_MAIL_GLOBAL_ATTEMPTS: ${AUTH_MAIL_GLOBAL_ATTEMPTS:-200}
      AUTH_MAIL_WINDOW_SECONDS: ${AUTH_MAIL_WINDOW_SECONDS:-3600}
      AUTH_LOGIN_ACCOUNT_ATTEMPTS: ${AUTH_LOGIN_ACCOUNT_ATTEMPTS:-10}
      AUTH_LOGIN_ADDRESS_ATTEMPTS: ${AUTH_LOGIN_ADDRESS_ATTEMPTS:-100}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-900}
      AUTH_REFRESH_SESSION_ATTEMPTS: ${AUTH_REFRESH_SESSION_ATTEMPTS:-30}
      AUTH_REFRESH_ADDRESS_ATTEMPTS: ${AUTH_REFRESH_ADDRESS_ATTEMPTS:-100}
      AUTH_REFRESH_WINDOW_SECONDS: ${AUTH_REFRESH_WINDOW_SECONDS:-60}
    depends_on: *business-deps
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9081/actuator/health/readiness]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 40s
  work-service:
    volumes: [work-files:/var/lib/tasknest/files]
    <<: *java
    build: {context: ../.., dockerfile: services/work-service/Dockerfile}
    environment:
      <<: *business-env
      MANAGEMENT_PORT: 9082
      IDENTITY_ALLOWED_ORIGINS: ${IDENTITY_ALLOWED_ORIGINS:-http://localhost:3000}
      WORK_FILES_ROOT: /var/lib/tasknest/files
      DB_NAME: tasknest_work
      DB_USERNAME: tasknest_work
      DB_PASSWORD: ${WORK_DB_PASSWORD:?Run setup-local.py}
    depends_on: *business-deps
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9082/actuator/health/readiness]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 40s
  notification-service:
    <<: *java
    build: {context: ../.., dockerfile: services/notification-service/Dockerfile}
    environment:
      <<: *business-env
      MANAGEMENT_PORT: 9083
      DB_NAME: tasknest_notification
      DB_USERNAME: tasknest_notification
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Run setup-local.py}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-TaskNest}
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
      PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
      PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:-}
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-http://localhost:3000}
      IDENTITY_OUTBOX_KEY_BASE64: ${IDENTITY_OUTBOX_KEY_BASE64:?Run setup-auth-secrets.py}
      IDENTITY_OUTBOX_KEY_ID: ${IDENTITY_OUTBOX_KEY_ID:?Run setup-auth-secrets.py}
    depends_on: *business-deps
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9083/actuator/health/readiness]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 40s
  ai-service:
    <<: *java
    profiles: [ai]
    build: {context: ../.., dockerfile: services/ai-service/Dockerfile}
    environment:
      <<: *client-env
      MANAGEMENT_PORT: 9084
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: tasknest_ai
      DB_USERNAME: tasknest_ai
      DB_PASSWORD: ${AI_DB_PASSWORD:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      AI_API_KEY: ${AI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_FALLBACK_API_KEY: ${AI_FALLBACK_API_KEY:-}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-openrouter}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-openrouter/free}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      AI_USER_DAILY_LIMIT: ${AI_USER_DAILY_LIMIT:-60}
      AI_GLOBAL_DAILY_LIMIT: ${AI_GLOBAL_DAILY_LIMIT:-300}
      AI_REQUESTS_PER_MINUTE: ${AI_REQUESTS_PER_MINUTE:-2}
      AI_TOKENS_PER_MINUTE: ${AI_TOKENS_PER_MINUTE:-8000}
      AI_TOKENS_PER_DAY: ${AI_TOKENS_PER_DAY:-200000}
      AI_MAX_COMPLETION_TOKENS: ${AI_MAX_COMPLETION_TOKENS:-1500}
    depends_on:
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
      mysql: {condition: service_healthy}
      identity-service: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9084/actuator/health/readiness]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 40s
  api-gateway:
    <<: *java
    build: {context: ../.., dockerfile: platform/api-gateway/Dockerfile}
    environment:
      <<: *client-env
      TASKNEST_PROXY_KEY: ${TASKNEST_PROXY_KEY:?Run setup-auth-secrets.py}
      MANAGEMENT_PORT: 9080
    depends_on:
      config-server: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
      identity-service: {condition: service_healthy}
      work-service: {condition: service_healthy}
      notification-service: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9080/actuator/health/readiness]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
  frontend:
    environment:
      TASKNEST_PROXY_KEY: ${TASKNEST_PROXY_KEY:?Run setup-auth-secrets.py}
    build: {context: ../.., dockerfile: frontend/Dockerfile}
    restart: unless-stopped
    networks: [backend]
    ports: ['127.0.0.1:${FRONTEND_PORT:-3000}:80']
    depends_on: {api-gateway: {condition: service_healthy}}
networks:
  backend:
volumes:
  work-files:
  mysql-data:
  rabbitmq-data:
