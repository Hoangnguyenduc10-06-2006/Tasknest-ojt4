# Exclude query strings, Referer and cookies: verification URLs contain one-time secrets.
log_format tasknest_safe '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
# Local HTTP only. Production requires a domain, TLS and Secure cookies.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 28m;
  # Docker can replace a backend container with a new IP during a deployment.
  # Resolve the gateway at request time so the frontend does not retain an old
  # container address and turn every API request into a 502 response.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_gateway api-gateway;
  access_log /var/log/nginx/access.log tasknest_safe;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location = /healthz { access_log off; return 200 'ok'; }
  # Verification tokens must never appear in access logs or same-origin Referer headers.
  location = /reset-password { access_log off; try_files $uri /index.html; }
  location = /verify-email { access_log off; try_files $uri /index.html; }
  location = /api/identity/auth/verify-email {
    access_log off;
    proxy_pass http://$api_gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Tasknest-Proxy-Key "${TASKNEST_PROXY_KEY}";
    proxy_set_header X-Tasknest-Client-IP $remote_addr;
    proxy_read_timeout 15s;
  }
  location ~ ^/api/work/projects/[^/]+/files$ {
    proxy_pass http://$api_gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Tasknest-Proxy-Key "${TASKNEST_PROXY_KEY}";
    proxy_set_header X-Tasknest-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
  location /api/ {
    proxy_pass http://$api_gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Tasknest-Proxy-Key "${TASKNEST_PROXY_KEY}";
    proxy_set_header X-Tasknest-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
  }
  location ~ ^/ws(/|$) {
    proxy_pass http://$api_gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Tasknest-Proxy-Key "${TASKNEST_PROXY_KEY}";
    proxy_set_header X-Tasknest-Client-IP $remote_addr;
    proxy_read_timeout 75s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
