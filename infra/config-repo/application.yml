eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    metadata-map:
      management.port: ${MANAGEMENT_PORT}
management:
  info:
    env:
      enabled: true
logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
