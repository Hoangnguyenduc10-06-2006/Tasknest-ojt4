spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    validate-on-migrate: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /tasknest
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

tasknest:
  identity:
    jwt:
      private-key-base64: ${IDENTITY_JWT_PRIVATE_KEY_BASE64}
    outbox:
      key-base64: ${IDENTITY_OUTBOX_KEY_BASE64}
      key-id: ${IDENTITY_OUTBOX_KEY_ID}
    allowed-origins: ${IDENTITY_ALLOWED_ORIGINS:http://localhost:3000}
    cookie:
      secure: ${IDENTITY_COOKIE_SECURE:true}
    rate-limit:
      mail-address-attempts: ${AUTH_MAIL_ADDRESS_ATTEMPTS:10}
      mail-global-attempts: ${AUTH_MAIL_GLOBAL_ATTEMPTS:200}
      mail-window-seconds: ${AUTH_MAIL_WINDOW_SECONDS:3600}
      login-account-attempts: ${AUTH_LOGIN_ACCOUNT_ATTEMPTS:10}
      login-address-attempts: ${AUTH_LOGIN_ADDRESS_ATTEMPTS:100}
      login-window-seconds: ${AUTH_LOGIN_WINDOW_SECONDS:900}
      refresh-session-attempts: ${AUTH_REFRESH_SESSION_ATTEMPTS:30}
      refresh-address-attempts: ${AUTH_REFRESH_ADDRESS_ATTEMPTS:100}
      refresh-window-seconds: ${AUTH_REFRESH_WINDOW_SECONDS:60}

# Relay runs only after mail delivery is explicitly enabled.
tasknest.mail.enabled: ${MAIL_ENABLED:false}
