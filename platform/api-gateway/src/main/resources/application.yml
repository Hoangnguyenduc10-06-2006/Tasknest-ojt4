spring:
  application:
    name: api-gateway
  security:
    user:
      name: disabled-scaffold-user
      password: ${SCAFFOLD_SECURITY_PASSWORD}
  config:
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      username: ${CONFIG_USERNAME}
      password: ${CONFIG_PASSWORD}
      fail-fast: true
server:
  forward-headers-strategy: none
  port: ${SERVER_PORT:8080}
management:
  server:
    port: ${MANAGEMENT_PORT:9080}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
