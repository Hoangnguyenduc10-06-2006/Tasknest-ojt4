spring:
  application:
    name: identity-service
  config:
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      username: ${CONFIG_USERNAME}
      password: ${CONFIG_PASSWORD}
      fail-fast: true
  security:
    user:
      name: disabled-scaffold-user
      password: ${SCAFFOLD_SECURITY_PASSWORD}
server:
  forward-headers-strategy: none
  port: ${SERVER_PORT:8081}
management:
  server:
    port: ${MANAGEMENT_PORT:9081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,rabbit
